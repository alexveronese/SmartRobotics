services:
  ros2-dev:
    image: mastering-ros2-rolling:dev
    build:
      context: .
      args:
        DEV_USER: ros
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        PACKT_REPO_REF: ${PACKT_REPO_REF:-main}
    init: true
    stdin_open: true
    tty: true
    environment:
      ROS_ACTIVE_CHAPTER: ${ROS_ACTIVE_CHAPTER:-Chapter03}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ros2-workspaces:/workspaces
      - ./sorting_ws:/workspaces/sorting_ws

  sorting-demo:
    image: mastering-ros2-rolling:dev
    build:
      context: .
      args:
        DEV_USER: ros
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        PACKT_REPO_REF: ${PACKT_REPO_REF:-main}
    init: true
    stdin_open: true
    tty: true
    shm_size: "1gb"
    environment:
      ROS_ACTIVE_CHAPTER: Chapter09
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      DEMO_HEADLESS: ${DEMO_HEADLESS:-false}
      DEMO_AUTO_START: ${DEMO_AUTO_START:-true}
    ports:
      - "6080:6080"
    volumes:
      - ros2-workspaces:/workspaces
      - ./sorting_ws:/workspaces/sorting_ws
    command: ["run-square-sorting-demo"]

volumes:
  ros2-workspaces:
