controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: true

gripper_controller:
  ros__parameters:
    joints:
      - joint_left_finger
      - joint_right_finger
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: true